[project]
name = "databricks_poc"
version = "0.0.1"
authors = [{ name = "nilabja.saha@knowit.se" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    # Must not be newer than the compute's runtime (DBR 18 LTS / serverless environment v5)
    "databricks-connect>=18.3,<18.4",
    "ipykernel",
    # Keep in sync with resources/dbt.job.yml
    "dbt-databricks==1.12.8",
    "shandy-sqlfmt[jinjafmt]==0.32.0",
]

[project.scripts]
main = "databricks_poc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.sqlfmt]
exclude = [".venv/**/*", "target/**/*", "dbt_packages/**/*"]
