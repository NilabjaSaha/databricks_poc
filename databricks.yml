# This is a Declarative Automation Bundle definition for databricks_poc.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_poc
  uuid: 478f0e49-c05c-418e-a687-b6b26dfc26d2

include:
  - resources/*.yml       #pulls in the job definition

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405619838309890.10.azuredatabricks.net
      profile: adb-7405619838309890                                # pin the dev profile
    variables:
      catalog: dbw_dbxpoc_sbx_weu
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405615711496172.12.azuredatabricks.net 
      profile: dbxpoc-prd                                          # pin the prod profile
      # Deployed by CD as sp-dbxpoc-cicd, so this resolves to the service principal's
      # own folder (its application ID), which it can write to.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # Prod jobs run as the CI service principal, never as a person.
      service_principal_name: e33d9717-3d53-4d8d-a39c-f1b2ff4512dc  
    variables:
      catalog: dbw_dbxpoc_prod_weu
      schema: prod
    permissions:
      - service_principal_name: e33d9717-3d53-4d8d-a39c-f1b2ff4512dc   # sp-dbxpoc-cicd (deploys and runs prod)
        level: CAN_MANAGE
      - user_name: nilabja.saha@knowit.se
        level: CAN_MANAGE
      - user_name: saquib.herman@knowit.se
        level: CAN_VIEW
