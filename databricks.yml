# This is a Declarative Automation Bundle definition for databricks_poc.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_poc
  uuid: 478f0e49-c05c-418e-a687-b6b26dfc26d2

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405619838309890.10.azuredatabricks.net
    variables:
      catalog: dbw_dbxpoc_sbx_weu
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405619838309890.10.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/nilabja.saha@knowit.se to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbw_dbxpoc_sbx_weu
      schema: prod
    permissions:
      - user_name: nilabja.saha@knowit.se
        level: CAN_MANAGE
